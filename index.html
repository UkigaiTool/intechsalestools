<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTECH | 業務ツール</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#19243a;font-family:"Segoe UI","Yu Gothic",Meiryo,sans-serif}
header{background:#10274b;color:white;padding:35px max(24px,calc((100vw - 920px)/2))}
header small{letter-spacing:.2em;color:#9bbbe8}h1{font-size:clamp(25px,4vw,36px);margin:12px 0 5px}
header p{color:#d4e2f7;margin:0}main{max-width:920px;margin:32px auto;padding:0 18px}
.intro{font-weight:700;margin-bottom:18px}.list{display:grid;gap:13px}
.tool{display:flex;align-items:center;gap:18px;background:white;border:1px solid #dce4ef;border-radius:14px;padding:22px 24px;text-decoration:none;color:inherit;box-shadow:0 3px 12px #132a4910;transition:.15s}
.tool:hover,.tool:focus-visible{border-color:#3172c8;transform:translateY(-2px);box-shadow:0 6px 18px #132a4922}
.number{font-size:20px;font-weight:800;color:#3172c8}.detail{display:flex;flex:1;flex-direction:column;gap:5px}
.detail strong{font-size:18px}.detail small{font-size:13px;color:#617089}.arrow{font-size:25px;color:#3172c8}
footer{text-align:center;font-size:12px;color:#718096;padding:24px}@media(max-width:500px){.tool{padding:18px 15px;gap:12px}.detail strong{font-size:16px}}

.picker{background:white;padding:26px;border:1px solid #dce4ef;border-radius:16px;display:grid;gap:13px;box-shadow:0 3px 12px #132a4910}
.picker label{font-weight:700}.picker select{width:100%;padding:15px;border:1px solid #aebdd0;border-radius:9px;font-size:16px;background:white;color:#19243a}
.open-tool{display:block;text-align:center;background:#2468bd;color:white;text-decoration:none;border-radius:9px;padding:16px;font-weight:700}
.open-tool.disabled{background:#a5b0bf;cursor:not-allowed}.hint{font-size:13px;color:#617089;line-height:1.7}
details{margin-top:26px}summary{cursor:pointer;font-weight:700;padding:12px 0}details .list{margin-top:10px}
</style></head><body>

</div>

<a class="tool" href="https://nuro.jp/partner_entry/menu" target="_blank" rel="noopener noreferrer"><span class="number">09</span><span class="detail"><strong>契約登録画面</strong></span><span class="arrow">↗</span></a>
<a class="tool" href="https://parss.jp/ivr/login/" target="_blank" rel="noopener noreferrer"><span class="number">10</span><span class="detail"><strong>PARSS</strong></span><span class="arrow">↗</span></a>
</script>
</main><footer>© INTECH</footer><script>
document.querySelector('details .list').insertAdjacentHTML('beforeend',document.getElementById('added-tool-cards').innerHTML);
const select=document.getElementById('tool-select');
const link=document.getElementById('open-tool');
select.addEventListener('change',()=>{
  const url=select.value;
  link.href=url||'#';
  link.classList.toggle('disabled',!url);
  link.setAttribute('aria-disabled',String(!url));
});
link.addEventListener('click',e=>{if(!select.value)e.preventDefault();});
</script></body></html>
